spring:
  config:
    import: optional:env[.env]

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
      schema-locations: classpath:db/idx_optimization.sql
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        show_sql: false
        format_sql: true
        use_sql_comments: true
        hbm2ddl:
          auto: update
        default_batch_fetch_size: 100
    defer-datasource-initialization: true
    servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 10MB
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET_KEY}

nlp:
  api-url: "http://localhost:8000"
  connect-timeout: 3000
  read-timeout: 10000

resilience4j:
  circuitbreaker:
    instances:
      nlpApi:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 40            # 일정 생성 쓰기 연산으로 사용자 임팩트가 크므로 기본값(50%)보다 엄격하게 설정
        slowCallDurationThreshold: 5s       # OpenAI 응답 지연 감지 기준, read-timeout(10s)의 절반 초과 시 비정상으로 판단
        slowCallRateThreshold: 50           # 지연 호출이 50% 이상이면 OpenAI 서버 과부하 상태로 판단
        waitDurationInOpenState: 30s        # OpenAI 장애 시 불필요한 재시도 방지, 통상 수분 내 복구되므로 30초 간격으로 재시도
        permittedNumberOfCallsInHalfOpenState: 2
        recordExceptions:
          - org.springframework.web.client.ResourceAccessException  # 타임아웃/네트워크 오류
          - org.springframework.web.client.HttpServerErrorException # OpenAI 5xx 오류

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
        management:
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
      slo:
        http.server.requests: 100ms, 200ms, 300ms, 400ms, 500ms, 600ms, 800ms, 1s
      tag:
        application: ${SPRING_APPLICATION_NAME:ohmo}

firebase:
  service-account-path: classpath:firebase-service-account.json

cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET}
    region: ap-northeast-2
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}

