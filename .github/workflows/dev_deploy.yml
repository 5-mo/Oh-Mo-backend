name: CI/CD

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: checkout
        uses: actions/checkout@v3

      # Docker login
      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker build & push
      - name: Docker build and push
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ohmo .
          docker push ${{ secrets.DOCKER_USERNAME }}/ohmo:latest

      # create .env file
      - name: Create .env file on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DATABASE_USERNAME,DATABASE_PASSWORD,DATABASE_URL,DOCKER_USERNAME
          script: |
            mkdir -p /home/ubuntu/Oh-Mo-backend
            cat <<EOF > /home/ubuntu/Oh-Mo-backend/.env
            DATABASE_USERNAME=$DATABASE_USERNAME
            DATABASE_PASSWORD=$DATABASE_PASSWORD
            DATABASE_URL=$DATABASE_URL
            DOCKER_USERNAME=$DOCKER_USERNAME
            EOF

      # copy docker-compose.yml to EC2
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/Oh-Mo-backend"

      # Deploy and docker-compose up and down
      - name: Deploy in EC2
        uses: appleboy/ssh-action@master
        env:
          COMPOSE: "/home/ubuntu/Oh-Mo-backend/docker-compose.yml"
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: COMPOSE
          script: |
            sudo docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            sudo docker-compose -f $COMPOSE down --rmi all
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/ohmo
            sudo docker-compose -f $COMPOSE up -d
            
